<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Coning</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Librería de Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Coning</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Inicialización global del Socket.io para el navegador
      window.socket = io("https://dokasoft.com", {
        path: "/coning/socket.io",
        transports: ["polling", "websocket"]
      });

      window.socket.on("connect", () => {
        console.log("🟢 Conectado al servidor de Socket.io desde WebGL, ID:", window.socket.id);
      });

      window.socket.on("connect_error", (err) => {
        console.error("🔴 Error de conexión en Socket.io WebGL:", err);
      });

      // Función global que Unity invoca mediante Application.ExternalCall o tu puente JS
      window.EnviarEventoServidor = function(nombreEvento, datosJson) {
        if (window.socket && window.socket.connected) {
          let datos = typeof datosJson === "string" ? JSON.parse(datosJson) : datosJson;
          window.socket.emit(nombreEvento, datos);
          console.log("📤 Socket.io emitió al servidor:", nombreEvento, datos);
        } else {
          console.warn("⚠️ Intento de enviar evento sin conexión activa de Socket.io:", nombreEvento);
        }
      };

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build.data",
        frameworkUrl: buildUrl + "/build.framework.js",
        codeUrl: buildUrl + "/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Dokasoft",
        productName: "Coning",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.myUnityInstance = unityInstance; // Guardamos la instancia globalmente
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

                // Puente para escuchar eventos de Node.js y pasarlos a Unity
                window.socket.onAny((event, ...args) => {
                  console.log("📥 Evento recibido del servidor web:", event, args);
                  try {
                    // Envía el evento al objeto GestorRed o el que reciba los sockets en Unity
                    unityInstance.SendMessage("Gestor", "RecibirEventoSocketWebGL", JSON.stringify({ evento: event, datos: args[0] }));
                  } catch (e) {
                    console.error("Error enviando evento a Unity:", e);
                  }
                });

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>
  </body>
</html>
